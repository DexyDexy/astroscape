<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroScape</title>
<meta name="description" content="Interactive 3D astrolabe: planetary positions, Moon phases, retrogrades, sunrise and sunset for any place and time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- Полифил import maps: Safari до 16.4 (iOS 16.3 и старше) их не понимает и модуль не запускается -->
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="scene"></div>
<div id="labels"></div>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">ASTROSCAPE<span data-i18n="loader">…</span></div>
  <div class="loader-err" id="loader-err" hidden></div>
</div>

<button id="btn-ui" data-i18n-title="uiToggle" aria-expanded="false"><i></i></button>
<div id="version"></div>

<div id="hud">

  <!-- ЛЕВАЯ КОЛОНКА -->
  <div class="col col-left">
    <section class="panel brand-panel collapsible" id="panel-time">
      <header>
        <div class="brand">
          <div class="brand-name">ASTRO<b>SCAPE</b></div>
          <div class="brand-sub" data-i18n="brandSub"></div>
        </div>
        <span class="hint" id="brand-hint"></span><i class="chev"></i>
      </header>
      <div class="body">
      <div class="clock">
        <div class="clock-time" id="clock-time">--:--:--</div>
        <div class="clock-date" id="clock-date">—</div>
      </div>
      <div class="kv">
        <div><span data-i18n="utc">UTC</span><b id="clock-utc">—</b></div>
        <div><span data-i18n="jd"></span><b id="clock-jd">—</b></div>
        <div><span data-i18n="lst"></span><b id="clock-lst">—</b></div>
      </div>
      <button class="loc-btn" id="btn-location" data-i18n-title="locTitle">
        <span class="loc-icon">◎</span>
        <span class="loc-text"><b id="loc-name">—</b><small id="loc-coords">—</small></span>
        <span class="loc-edit" data-i18n="locEdit"></span>
      </button>
      </div>
    </section>

    <section class="panel collapsible" id="panel-moon">
      <header><h2 data-i18n="moon"></h2><span class="hint" id="moon-phase-name">—</span><i class="chev"></i></header>
      <div class="body">
        <div class="moon-row">
          <canvas id="moon-canvas" width="128" height="128"></canvas>
          <div class="kv moon-kv">
            <div><span data-i18n="illum"></span><b id="moon-illum">—</b></div>
            <div><span data-i18n="age"></span><b id="moon-age">—</b></div>
            <div><span data-i18n="sign"></span><b id="moon-sign">—</b></div>
            <div><span data-i18n="distance"></span><b id="moon-dist">—</b></div>
            <div><span data-i18n="riseSet"></span><b id="moon-riseset">—</b></div>
          </div>
        </div>
        <div class="next-phases">
          <div class="np np-new"><span class="np-ico">●</span><div><span data-i18n="newMoon"></span><b id="moon-next-new">—</b><small id="moon-next-new-in"></small></div></div>
          <div class="np np-full"><span class="np-ico">○</span><div><span data-i18n="fullMoon"></span><b id="moon-next-full">—</b><small id="moon-next-full-in"></small></div></div>
        </div>
        <ul class="list" id="moon-quarters"></ul>
        <div class="kv small">
          <div><span data-i18n="apsis"></span><b id="moon-apsis">—</b></div>
        </div>
      </div>
    </section>

    <section class="panel collapsible" id="panel-sun">
      <header><h2 data-i18n="sunPanel"></h2><span class="hint" id="sun-hint">—</span><i class="chev"></i></header>
      <div class="body">
        <div class="kv">
          <div><span data-i18n="sunrise"></span><b id="sun-rise">—</b></div>
          <div><span data-i18n="sunset"></span><b id="sun-set">—</b></div>
          <div><span data-i18n="dayLength"></span><b id="sun-daylen">—</b></div>
          <div><span data-i18n="noon"></span><b id="sun-noon">—</b></div>
          <div><span data-i18n="twilight"></span><b id="sun-twilight">—</b></div>
          <div><span data-i18n="altAz"></span><b id="sun-altaz">—</b></div>
          <div><span data-i18n="sign"></span><b id="sun-sign">—</b></div>
        </div>
        <ul class="list" id="seasons-list"></ul>
      </div>
    </section>
  </div>

  <!-- ПРАВАЯ КОЛОНКА -->
  <div class="col col-right">
    <div class="toolbar">
      <button id="btn-view" class="tb" data-i18n="btnHelio" data-i18n-title="btnViewTitle"></button>
      <button id="btn-sky" class="tb" data-i18n="btnSky" data-i18n-title="btnSkyTitle"></button>
      <button id="btn-top" class="tb" data-i18n="btnTop" data-i18n-title="btnTopTitle"></button>
      <button id="btn-reset" class="tb" data-i18n-title="btnResetTitle">⟲</button>
      <button id="btn-aspects" class="tb on" data-i18n="btnAspects" data-i18n-title="btnAspectsTitle"></button>
      <button id="btn-stars" class="tb on" data-i18n="btnStars" data-i18n-title="btnStarsTitle"></button>
      <button id="btn-bloom" class="tb on" data-i18n="btnBloom" data-i18n-title="btnBloomTitle"></button>
      <select id="lang" class="tb"></select>
      <button id="btn-help" class="tb" data-i18n-title="btnHelpTitle">?</button>
    </div>

    <section class="panel collapsible" id="panel-situation">
      <header><h2 data-i18n="situation"></h2><span class="hint" id="situation-hint">—</span><i class="chev"></i></header>
      <div class="body">
        <div class="kv">
          <div><span data-i18n="ascendant"></span><b id="sit-asc">—</b></div>
          <div><span data-i18n="midheaven"></span><b id="sit-mc">—</b></div>
          <div><span data-i18n="dayRuler"></span><b id="sit-day">—</b></div>
          <div><span data-i18n="hourRuler"></span><b id="sit-hour">—</b></div>
          <div><span data-i18n="houseSystem"></span><b id="sit-sys">—</b></div>
        </div>
      </div>
    </section>

    <section class="panel collapsible" id="panel-reading">
      <header><h2 data-i18n="reading"></h2><span class="hint" id="reading-hint"></span><i class="chev"></i></header>
      <div class="body">
        <div class="reading-lead" id="reading-lead">—</div>
        <ul class="list reading-list" id="reading-list"></ul>
        <p class="note" id="reading-note"></p>
      </div>
    </section>

    <section class="panel collapsible" id="panel-planets">
      <header><h2 data-i18n="planets"></h2><span class="hint" id="planets-hint"></span><i class="chev"></i></header>
      <div class="body">
        <table class="planets" id="planets-table">
          <thead><tr><th></th><th data-i18n="thBody"></th><th data-i18n="thPos"></th><th data-i18n="thHouse" data-i18n-title="thHouseTitle"></th><th data-i18n="thAlt" data-i18n-title="thAltTitle"></th><th data-i18n="thRise"></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="planet-detail" id="planet-detail"></div>
      </div>
    </section>

    <section class="panel collapsible" id="panel-retro">
      <header><h2 data-i18n="retro"></h2><span class="hint" id="retro-hint">—</span><i class="chev"></i></header>
      <div class="body">
        <ul class="list retro-list" id="retro-list"></ul>
      </div>
    </section>

    <section class="panel collapsible" id="panel-aspects">
      <header><h2 data-i18n="aspects"></h2><span class="hint" id="aspects-hint">—</span><i class="chev"></i></header>
      <div class="body">
        <ul class="list aspects-list" id="aspects-list"></ul>
      </div>
    </section>

    <section class="panel collapsible collapsed" id="panel-eclipses">
      <header><h2 data-i18n="eclipses"></h2><span class="hint" id="eclipse-hint">—</span><i class="chev"></i></header>
      <div class="body">
        <ul class="list" id="eclipse-list"></ul>
      </div>
    </section>
  </div>

  <!-- УПРАВЛЕНИЕ ВРЕМЕНЕМ -->
  <div class="timebar panel" id="timebar">
    <div class="tb-row">
      <button class="tbtn" data-step="-86400" data-i18n-title="stepMinusDay">◀◀</button>
      <button class="tbtn" data-step="-3600" data-i18n-title="stepMinusHour">◀</button>
      <button class="tbtn play" id="btn-play" data-i18n-title="play">❚❚</button>
      <button class="tbtn" data-step="3600" data-i18n-title="stepPlusHour">▶</button>
      <button class="tbtn" data-step="86400" data-i18n-title="stepPlusDay">▶▶</button>
      <select id="speed" data-i18n-title="speedTitle">
        <option value="1" data-i18n="speeds.0"></option>
        <option value="60" data-i18n="speeds.1"></option>
        <option value="600" data-i18n="speeds.2"></option>
        <option value="3600" data-i18n="speeds.3"></option>
        <option value="21600" data-i18n="speeds.4"></option>
        <option value="86400" data-i18n="speeds.5"></option>
        <option value="604800" data-i18n="speeds.6"></option>
        <option value="2592000" data-i18n="speeds.7"></option>
      </select>
      <button class="tbtn now" id="btn-now" data-i18n="now" data-i18n-title="nowTitle"></button>
      <input type="datetime-local" id="dt-input" step="60" data-i18n-title="dtTitle">
      <select id="span" data-i18n-title="spanTitle">
        <option value="86400" data-i18n="spans.0"></option>
        <option value="2592000" selected data-i18n="spans.1"></option>
        <option value="31536000" data-i18n="spans.2"></option>
        <option value="315360000" data-i18n="spans.3"></option>
        <option value="3153600000" data-i18n="spans.4"></option>
      </select>
      <button class="tbtn fold" id="btn-timefold"><i class="chev"></i></button>
    </div>
    <div class="tb-row slider-row">
      <span class="slider-lbl" id="slider-min">—</span>
      <input type="range" id="slider" min="0" max="2000" value="1000">
      <span class="slider-lbl" id="slider-max">—</span>
    </div>
  </div>

  <!-- МЕСТО НАБЛЮДЕНИЯ -->
  <div class="modal" id="modal-location" hidden>
    <div class="modal-box panel">
      <header><h2 data-i18n="locHeader"></h2><button class="close" id="loc-close">✕</button></header>
      <div class="body">
        <div class="only-normal">
          <label><span data-i18n="city"></span><select id="loc-preset"></select></label>
          <div class="row2">
            <label><span data-i18n="lat"></span><input type="number" id="loc-lat" step="0.0001" min="-90" max="90"></label>
            <label><span data-i18n="lon"></span><input type="number" id="loc-lon" step="0.0001" min="-180" max="180"></label>
          </div>
          <label><span data-i18n="name"></span><input type="text" id="loc-label" maxlength="40" data-i18n-placeholder="namePh"></label>
        </div>
        <p class="note only-map" data-i18n="mapHint"></p>
        <div class="loc-live only-map" id="loc-live">—</div>
        <div class="row2 only-normal">
          <button class="btn ghost" id="loc-map" data-i18n="pickOnMap"></button>
          <button class="btn ghost" id="loc-geo" data-i18n="gps"></button>
        </div>
        <div class="row2">
          <button class="btn ghost only-map" id="loc-cancel" data-i18n="cancel"></button>
          <button class="btn" id="loc-apply" data-i18n="apply"></button>
        </div>
        <p class="note only-normal" data-i18n="locNote"></p>
      </div>
    </div>
  </div>

  <!-- ПЕРВЫЙ ЗАПУСК: МЕСТО НАБЛЮДЕНИЯ -->
  <div class="modal" id="modal-welcome" hidden>
    <div class="modal-box panel welcome">
      <header><h2 data-i18n="welcomeTitle"></h2><button class="close" id="welcome-close">✕</button></header>
      <div class="body">
        <p class="lead" data-i18n="welcomeText"></p>
        <p class="guess" id="welcome-guess"></p>
        <div class="choices">
          <button class="btn" id="welcome-use"></button>
          <button class="btn ghost" id="welcome-gps"></button>
          <button class="btn ghost" id="welcome-manual" data-i18n="pickManual"></button>
        </div>
        <p class="note" data-i18n="privacyNote"></p>
      </div>
    </div>
  </div>

  <!-- СПРАВКА -->
  <div class="modal" id="modal-help" hidden>
    <div class="modal-box panel wide">
      <header><h2 data-i18n="helpHeader"></h2><button class="close" id="help-close">✕</button></header>
      <div class="body help" id="help-body"></div>
    </div>
  </div>

  <div id="views" hidden></div>

  <div id="toast" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="js/data.js"></script>
<script src="js/texts.js"></script>
<script src="js/i18n.js"></script>
<script src="js/locales.js"></script>
<script src="js/astro.js"></script>
<script src="js/scene.js"></script>
<script src="js/interp.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
  import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
  window.AstroScape.boot({ THREE, OrbitControls, CSS2DRenderer, CSS2DObject, EffectComposer, RenderPass, UnrealBloomPass, OutputPass,
    LineSegments2, LineSegmentsGeometry, LineMaterial });
</script>
</body>
</html>
